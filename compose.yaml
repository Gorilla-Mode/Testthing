services:
  app:
    build:
      context: .
    pull_policy: build
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/
            - src/generated/
            - coverage/
            - test-results/
            - playwright-report/
        - action: rebuild
          path: ./build.gradle
        - action: rebuild
          path: ./settings.gradle
        - action: rebuild
          path: ./gradle
        - action: rebuild
          path: ./gradlew
        - action: rebuild
          path: ./gradlew.bat
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./.dockerignore
