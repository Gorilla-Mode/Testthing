plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'demo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

def frontendDev = providers.gradleProperty('frontendDev').isPresent()
def frontendDirectory = layout.projectDirectory.dir('frontend')

tasks.register('frontendInstall', Exec) {
    workingDir frontendDirectory
    commandLine 'npm', 'ci', '--no-audit', '--no-fund'
    inputs.files(frontendDirectory.file('package.json'), frontendDirectory.file('package-lock.json'))
    outputs.dir(frontendDirectory.dir('node_modules'))
}

tasks.register('frontendBuild', Exec) {
    dependsOn 'frontendInstall'
    workingDir frontendDirectory
    commandLine 'npm', 'run', 'build'
    inputs.files(fileTree('frontend/src'), frontendDirectory.file('package.json'),
            frontendDirectory.file('package-lock.json'), frontendDirectory.file('vite.config.ts'),
            frontendDirectory.file('tsconfig.json'))
    outputs.dir(frontendDirectory.dir('dist'))
}

tasks.register('frontendResources', Sync) {
    dependsOn 'frontendBuild'
    from(frontendDirectory.dir('dist/assets')) { into 'static/assets' }
    from(frontendDirectory.file('dist/.vite/manifest.json')) { into 'web' }
    into layout.buildDirectory.dir('generated/frontend')
}

tasks.named('processResources') {
    if (!frontendDev) {
        dependsOn 'frontendResources'
        from(layout.buildDirectory.dir('generated/frontend'))
    }
}

tasks.named('bootRun') {
    if (frontendDev) {
        systemProperty 'app.frontend.dev', 'true'
    }
}
