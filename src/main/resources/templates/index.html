<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome | Demo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<main class="card">
    <p class="eyebrow">Demo</p>
    <h1>A little hello goes a long way.</h1>
    <p class="greeting" th:text="${greeting.message}">Welcome!</p>
    <p>Enter your name to get a personal greeting.</p>

    <form th:method="get" th:action="@{/}" th:object="${greeting}">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" th:field="*{name}"
               placeholder="e.g. Alex" autocomplete="given-name">
        <button th:type="submit">Say hello</button>
    </form>
    <form th:method="get"  th:action="@{/loggedin}">
        <button th:type="submit">Login</button>
    </form>
</main>
</body>
</html>
